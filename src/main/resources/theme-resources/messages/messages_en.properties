# MaxMind minFraud Error Messages

# Error shown when login is blocked due to high risk score
loginTooRisky=Login denied due to suspicious activity. Please contact support if you believe this is an error.

# Error shown when MaxMind API fails and fail mode is FAIL_CLOSED
maxmindApiError=Unable to verify login security. Please try again later or contact support.

# Error shown when MaxMind authenticator is not configured properly
maxmindConfigError=Authentication service configuration error. Please contact your administrator.

# Error shown when user does not have MFA configured and MaxMind triggers CHALLENGE
mfaRequiredForSuspiciousActivity=Multi-factor authentication is required due to suspicious login activity. Please configure MFA before attempting to log in, or contact support for assistance.
